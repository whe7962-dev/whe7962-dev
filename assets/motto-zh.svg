<svg xmlns="http://www.w3.org/2000/svg" width="600" height="40" viewBox="0 0 600 40" role="img" aria-labelledby="title">
  <title id="title">把想法做成有温度的体验。</title>
  <style>
    text { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
    .reveal { animation: type 8s steps(12, end) infinite; }
    @keyframes type { 0%, 8% { width: 0; } 42%, 92% { width: 180px; } 100% { width: 0; } }
    @media (prefers-color-scheme: dark) { text { fill: #9198a1; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  </style>
  <defs><clipPath id="reveal"><rect class="reveal" x="210" y="0" width="180" height="40"/></clipPath></defs>
  <text x="300" y="25" text-anchor="middle" clip-path="url(#reveal)">把想法做成有温度的体验。</text>
</svg>
