<svg xmlns="http://www.w3.org/2000/svg" width="600" height="40" viewBox="0 0 600 40" role="img" aria-labelledby="title">
  <title id="title">Turning ideas into experiences with warmth.</title>
  <style>
    text { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .reveal { animation: type 8s steps(42, end) infinite; }
    @keyframes type { 0%, 8% { width: 0; } 42%, 92% { width: 360px; } 100% { width: 0; } }
    @media (prefers-color-scheme: dark) { text { fill: #9198a1; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  </style>
  <defs><clipPath id="reveal"><rect class="reveal" x="120" y="0" width="360" height="40"/></clipPath></defs>
  <text x="300" y="25" text-anchor="middle" clip-path="url(#reveal)">Turning ideas into experiences with warmth.</text>
</svg>
